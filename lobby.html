<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Creepster&display=swap');
        
        body {
            margin: 0; padding: 0; background-color: #020617; color: #f8fafc;
            font-family: 'Cinzel', serif; min-height: 100vh;
            background-image: linear-gradient(to bottom, rgba(2, 6, 23, 0.4) 0%, rgba(2, 6, 23, 0.95) 100%), url('https://zomb13lord.github.io/zombielords-playhouse/background.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        
        .emerald-text { color: #10b981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
        .playhouse-glow { text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 15px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,1), 0 0 45px rgba(0,0,0,1); }

        .zombie-navbar { position: relative; background-image: url('https://zomb13lord.github.io/zombielords-playhouse/navbar-bg.jpg'); background-size: cover; background-position: center; }
        .zombie-navbar::before { content: ''; position: absolute; inset: 0; background: rgba(2, 6, 23, 0.75); z-index: 0; }
        .zombie-navbar > div { position: relative; z-index: 1; }

        .bleeding-header {
            font-family: 'Creepster', system-ui; color: #ffffff; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.9), 0 0 10px rgba(16, 185, 129, 0.6), 4px 4px 0px #000, -2px -2px 0px #000;
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 15px rgba(16, 185, 129, 0.6), 4px 4px 0px #000; }
            100% { text-shadow: 0 0 35px rgba(16, 185, 129, 1), 0 0 15px rgba(16, 185, 129, 0.8), 4px 4px 0px #000; }
        }

        .text-shadow-heavy { text-shadow: 2px 2px 5px #000, 0 0 15px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,1); }
        
        .module-card { border: 2px solid rgba(16, 185, 129, 0.3); box-shadow: 0 8px 30px rgba(0,0,0,0.5); transition: all 0.3s ease; cursor: pointer; }
        .module-card:hover { border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        
        .card-selected { border-color: #34d399 !important; box-shadow: 0 0 35px rgba(16, 185, 129, 0.7) !important; transform: scale(1.02); z-index: 20; }
        .glow-red { filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.9)) drop-shadow(0 0 4px rgba(239, 68, 68, 1)); }

        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: #020617; border: 1px solid #10b981; border-radius: 8px; width: 100%; max-width: 400px; padding: 30px; box-shadow: 0 0 40px rgba(16, 185, 129, 0.2), inset 0 0 20px rgba(0,0,0,1); text-align: center; }
        .modal-box-large { max-width: 800px; padding: 15px; }
        
        .dynamic-modal-bg {
            position: relative; overflow: hidden; border: 1px solid #10b981; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 0 40px rgba(16, 185, 129, 0.2), inset 0 0 20px rgba(0,0,0,1); text-align: center;
        }
        .dynamic-modal-bg::before {
            content: ''; position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0;
            var(--dynamic-bg);
        }
        .dynamic-modal-content {
            position: relative; z-index: 1; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(8px); padding: 30px; height: 100%;
        }

        .wicked-btn {
            background: linear-gradient(180deg, #064e3b 0%, #022c22 100%); color: #a7f3d0; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 0.15em; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #10b981; border-bottom: 3px solid #047857; border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 1px 1px rgba(16, 185, 129, 0.4);
        }
        .wicked-btn:hover { box-shadow: 0 0 20px rgba(16, 185, 129, 0.5), inset 0 1px 1px rgba(16, 185, 129, 0.6); border-color: #34d399; color: #ffffff; }
        .wicked-btn:active { transform: translateY(2px); border-bottom-width: 1px; box-shadow: 0 2px 8px rgba(0,0,0,0.8); }

        .btn-cancel { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 12px; border-radius: 4px; font-weight: 900; text-transform: uppercase; font-size: 12px; cursor: pointer; transition: all 0.2s; width: 100%; letter-spacing: 0.1em; }
        .btn-cancel:hover { background: #1e293b; color: #fff; border-color: #475569; }

        .ghosted-btn { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); }
    </style>
    
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBSUXdz7HqwkENhQqEJLItxYm-LAwkgbmY", authDomain: "zombielords-playhouse.firebaseapp.com", projectId: "zombielords-playhouse", storageBucket: "zombielords-playhouse.firebasestorage.app", messagingSenderId: "795162260246", appId: "1:795162260246:web:97f0361751ac1359b31637" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();

        let userProfile = { role: 'User', permissions: {} };
        let selectedCard = null;
        let recommendations = {};

        const loreFallbacks = {
            crypt: "A subterranean repository for your statistical souls. Exhume past sessions, dissect historical variances, and resurrect data from the ashes of forgotten wagers.",
            baccarat: "Decode the eternal symmetry of Player and Banker. Map the rhythmic decay of the shoe, isolate tie anomalies, and exploit the deterministic laws governing the draw.",
            dice: "Map the kinematic chaos of the bones. Track the shooter's axis stability, isolate mechanical signatures, and capitalize on the inevitable collapse into the seven.",
            poker: "A grimoire for the psychological predator. Calculate true table equity, log your bloodline bankroll, and systematically dissect the behavioral flaws of your prey.",
            roulette: "Audit the physical matrix of the Devil's Wheel. Map rotor deceleration, exploit mechanical biases, and chart the deterministic ball drop against the illusion of chance.",
            sportsbook: "Quantify the geometry of human conflict. Uncover edge detection paradigms, weaponize parlay structures, and systematically drain the bookmaker's reserves.",
            casino: "Enter the digital realm of chance. Wager your soul against the house in a virtual arena of endless possibilities.",
            bloodlord: "The heir to the underworld throne demands tribute. Enter the domain of the BloodLord, where the games are fierce, the stakes are fun, and the young prince rules supreme.",
            admin: "Govern the souls of the damned. Dictate access, forge new overlords, and manage the bureaucratic nightmare of the Playhouse."
        };

        function showSystemMessage(msg) {
            document.getElementById('sys-msg-text').innerText = msg;
            document.getElementById('sys-msg-modal').style.display = 'flex';
        }
        function closeSystemMessage() { document.getElementById('sys-msg-modal').style.display = 'none'; }

        auth.onAuthStateChanged(async (user) => {
            if (!user) window.location.href = "index.html";
            else {
                document.getElementById('user-tag').innerText = user.displayName || "Wicked Soul";
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        userProfile = doc.data();
                        await fetchRecommendations();
                        applyPermissions();
                    } else { 
                        showSystemMessage("Your soul registry could not be located."); 
                        setTimeout(() => window.location.href = "index.html", 2000);
                    }
                } catch (error) { console.error("Firestore Access Error:", error); }
            }
        });

        async function fetchRecommendations() {
            try {
                const recDoc = await db.collection('system').doc('recommendations').get();
                if (recDoc.exists) {
                    recommendations = recDoc.data();
                    
                    ['crypt', 'baccarat', 'dice', 'poker', 'roulette', 'casino', 'bloodlord', 'admin'].forEach(mod => {
                        const el = document.getElementById(`lore-${mod}`);
                        if (el) el.innerText = recommendations[`lore_${mod}`] || loreFallbacks[mod];
                    });

                    const sbEl = document.getElementById('lore-sportsbook');
                    if (sbEl) {
                        let showProphecy = false;
                        if (recommendations.sportsbookBet && recommendations.sportsbookExpiration) {
                            const now = new Date().getTime();
                            if (now < recommendations.sportsbookExpiration) {
                                showProphecy = true;
                                sbEl.innerHTML = `<span class="text-amber-400 font-bold uppercase tracking-widest">ZOMBIELORD'S PROPHECY:</span><br><span class="text-white">${recommendations.sportsbookBet}</span>`;
                            }
                        }
                        if (!showProphecy) {
                            sbEl.innerText = recommendations.lore_sportsbook || loreFallbacks.sportsbook;
                        }
                    }
                }
            } catch (e) { console.error("Failed to fetch recommendations", e); }
        }

        function applyPermissions() {
            const role = userProfile.role || 'User';
            const perms = userProfile.permissions || {};

            if (role === 'Admin' || role === 'Master Admin') {
                const adminCard = document.getElementById('card-admin');
                if(adminCard) { adminCard.classList.remove('hidden'); adminCard.classList.add('flex'); }
            }

            const modules = ['crypt', 'baccarat', 'dice', 'poker', 'roulette', 'sportsbook', 'casino', 'bloodlord'];
            
            modules.forEach(mod => {
                const card = document.getElementById(`card-${mod}`);
                const lockIcon = document.getElementById(`lock-${mod}`);
                if (!card) return;

                let state = perms[mod];
                if (state === true) state = 'Enabled';
                if (state === false) state = 'Visible';
                if (state === undefined) state = (mod === 'bloodlord' || mod === 'casino') ? 'Hidden' : 'Visible';

                if (state === 'Hidden') {
                    card.classList.add('hidden');
                    card.classList.remove('flex');
                } else if (state === 'Visible') {
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                    if(lockIcon) lockIcon.classList.remove('hidden');
                } else if (state === 'Enabled') {
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                    if(lockIcon) lockIcon.classList.add('hidden');
                }
            });
        }

        function handleCardTap(moduleId, stableUrl, betaUrl, cardName, bgUrl) {
            if (selectedCard !== moduleId) {
                document.querySelectorAll('.module-card').forEach(c => c.classList.remove('card-selected'));
                document.getElementById(`card-${moduleId}`).classList.add('card-selected');
                selectedCard = moduleId;
            } else {
                if (moduleId === 'admin') {
                    window.location.href = stableUrl;
                    return;
                }
                
                const videoUrl = recommendations[`${moduleId}Video`];
                const hasVideo = !!videoUrl;
                const bypassVideo = ['crypt', 'sportsbook', 'casino', 'bloodlord'].includes(moduleId) || !hasVideo;

                let state = userProfile.permissions[moduleId];
                if (state === true) state = 'Enabled';
                const isEnabled = (state === 'Enabled');

                if (!isEnabled) {
                    document.getElementById('lockout-modal').style.display = 'flex';
                    return;
                }

                if (bypassVideo) {
                    if (moduleId === 'sportsbook') { window.open(recommendations.sportsbookUrl || stableUrl, '_blank'); return; }
                    if (moduleId === 'casino') { window.open(recommendations.casinoUrl || stableUrl, '_blank'); return; }
                    if (moduleId === 'bloodlord') { window.open(recommendations.bloodlordUrl || '#', '_blank'); return; }
                    
                    executeModuleAction(moduleId, stableUrl, betaUrl);
                } else {
                    openDynamicModal(moduleId, stableUrl, betaUrl, videoUrl, cardName, bgUrl);
                }
            }
        }

        function openDynamicModal(moduleId, stableUrl, betaUrl, videoUrl, cardName, bgUrl) {
            const modal = document.getElementById('dynamic-module-modal');
            const bgContainer = document.getElementById('dynamic-modal-bg-container');
            const title = document.getElementById('dynamic-modal-title');
            const btnContainer = document.getElementById('dynamic-btn-container');
            
            bgContainer.style.backgroundImage = `url('${bgUrl}')`;
            title.innerText = cardName;

            btnContainer.innerHTML = `
                <button id="btn-watch-video" class="bg-amber-950/60 hover:bg-amber-700/80 border border-amber-500/50 text-amber-100 w-full py-3 text-xs font-black uppercase tracking-widest transition-all rounded"><i class="fa-solid fa-play mr-2"></i> Watch Video</button>
                <button id="btn-open-module" class="wicked-btn w-full py-3 text-xs">Open ${cardName}</button>
                <button onclick="closeModals()" class="btn-cancel mt-2">Cancel</button>
            `;

            document.getElementById('btn-watch-video').onclick = () => openViewingOrb(videoUrl);
            
            document.getElementById('btn-open-module').onclick = () => {
                const role = userProfile.role;
                const canAccessBeta = (role === 'Beta User' || role === 'Admin' || role === 'Master Admin');

                if (betaUrl && canAccessBeta) {
                    btnContainer.innerHTML = `
                        <button id="btn-stable" class="wicked-btn w-full py-3 text-xs">Stable</button>
                        <button id="btn-beta" class="bg-amber-950/60 hover:bg-amber-700/80 border border-amber-500/50 text-amber-100 w-full py-3 text-xs font-black uppercase tracking-widest transition-all rounded">Beta</button>
                        <button onclick="closeModals()" class="btn-cancel mt-2">Cancel</button>
                    `;
                    document.getElementById('btn-stable').onclick = () => { window.location.href = stableUrl; };
                    document.getElementById('btn-beta').onclick = () => { window.location.href = betaUrl; };
                } else {
                    executeModuleAction(moduleId, stableUrl, betaUrl);
                }
            };

            modal.style.display = 'flex';
        }

        async function openViewingOrb(url) {
            document.getElementById('dynamic-module-modal').style.display = 'none';
            const orb = document.getElementById('viewing-orb-modal');
            const iframe = document.getElementById('orb-iframe');
            iframe.src = url;
            orb.style.display = 'flex';

            try {
                if (orb.requestFullscreen) await orb.requestFullscreen();
                else if (orb.webkitRequestFullscreen) await orb.webkitRequestFullscreen();
                
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                console.log("Fullscreen/Orientation lock not supported or denied.", err);
            }
        }

        async function closeViewingOrb() {
            document.getElementById('viewing-orb-modal').style.display = 'none';
            document.getElementById('orb-iframe').src = ""; 

            try {
                if (document.fullscreenElement) {
                    if (document.exitFullscreen) await document.exitFullscreen();
                    else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
                }
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            } catch (err) {
                console.log("Exit fullscreen/unlock failed.", err);
            }
        }

        function executeModuleAction(moduleId, stableUrl, betaUrl) {
            const role = userProfile.role;
            const canAccessBeta = (role === 'Beta User' || role === 'Admin' || role === 'Master Admin');

            if (betaUrl && canAccessBeta) {
                const modal = document.getElementById('dynamic-module-modal');
                const bgContainer = document.getElementById('dynamic-modal-bg-container');
                const title = document.getElementById('dynamic-modal-title');
                const btnContainer = document.getElementById('dynamic-btn-container');
                
                bgContainer.style.backgroundImage = `url('https://zomb13lord.github.io/zombielords-playhouse/${moduleId}-card.jpg')`;
                title.innerText = moduleId.toUpperCase();

                btnContainer.innerHTML = `
                    <button id="btn-stable" class="wicked-btn w-full py-3 text-xs">Stable</button>
                    <button id="btn-beta" class="bg-amber-950/60 hover:bg-amber-700/80 border border-amber-500/50 text-amber-100 w-full py-3 text-xs font-black uppercase tracking-widest transition-all rounded">Beta</button>
                    <button onclick="closeModals()" class="btn-cancel mt-2">Cancel</button>
                `;
                document.getElementById('btn-stable').onclick = () => { window.location.href = stableUrl; };
                document.getElementById('btn-beta').onclick = () => { window.location.href = betaUrl; };
                modal.style.display = 'flex';
            } else {
                if (moduleId === 'poker') window.open(stableUrl, '_blank');
                else window.location.href = stableUrl;
            }
        }

        function closeModals() {
            document.getElementById('lockout-modal').style.display = 'none';
            document.getElementById('dynamic-module-modal').style.display = 'none';
        }

        function logout() { auth.signOut().then(() => { window.location.href = "index.html"; }); }
    </script>
</head>

    </div>

    <div id="sys-msg-modal" class="modal-mask">
