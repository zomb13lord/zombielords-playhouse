<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Tracker v1.25.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: monospace; }
        .controller-panel { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(16, 185, 129, 0.25); padding: 20px; border-radius: 8px; }
        .pad-btn { background: #020617; color: #fff; border: 1px solid #334155; width: 50px; height: 50px; cursor: pointer; border-radius: 4px; }
        .pad-btn.active { background: #f59e0b; color: #000; }
        .act-btn { padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body>
    <div class="main-wrapper p-4 max-w-4xl mx-auto">
        <div id="status-log" class="text-[10px] text-emerald-500 mb-2">SYSTEM READY</div>
        
        <div class="controller-panel">
            <div class="flex justify-center gap-12 mb-6">
                <div id="leftPadContainer" class="grid grid-cols-3 gap-2"></div>
                <div id="rightPadContainer" class="grid grid-cols-3 gap-2"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button class="act-btn bg-emerald-600" onclick="submitRoll()">Standard Roll</button>
                <button class="act-btn bg-red-600" onclick="resetState()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBSUXdz7HqwkENhQqEJLItxYm-LAwkgbmY", authDomain: "zombielords-playhouse.firebaseapp.com", projectId: "zombielords-playhouse", storageBucket: "zombielords-playhouse.firebasestorage.app", messagingSenderId: "795162260246", appId: "1:795162260246:web:97f0361751ac1359b31637" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); 
        const db = firebase.firestore();

        let state = { selectedLeft: null, selectedRight: null };

        // 1. Force Immediate UI Render
        function initDualPads() {
            const l = document.getElementById('leftPadContainer');
            const r = document.getElementById('rightPadContainer');
            for(let i=1; i<=6; i++) {
                l.innerHTML += `<button class="pad-btn" id="l-pad-${i}" onclick="selectDie('left', ${i})">${i}</button>`;
                r.innerHTML += `<button class="pad-btn" id="r-pad-${i}" onclick="selectDie('right', ${i})">${i}</button>`;
            }
        }

        function selectDie(side, val) {
            if(side === 'left') {
                document.querySelectorAll('[id^="l-pad-"]').forEach(el => el.classList.remove('active'));
                state.selectedLeft = val;
                document.getElementById(`l-pad-${val}`).classList.add('active');
            } else {
                document.querySelectorAll('[id^="r-pad-"]').forEach(el => el.classList.remove('active'));
                state.selectedRight = val;
                document.getElementById(`r-pad-${val}`).classList.add('active');
            }
        }

        async function submitRoll() {
            if(!state.selectedLeft || !state.selectedRight) return alert("Select dice!");
            try {
                await db.collection("test_roll").add({
                    sum: state.selectedLeft + state.selectedRight,
                    ts: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('status-log').innerText = "ROLL SAVED TO DATABASE";
                resetState();
            } catch (e) {
                document.getElementById('status-log').innerText = "DB ERROR: " + e.message;
            }
        }

        function resetState() {
            state.selectedLeft = null; state.selectedRight = null;
            document.querySelectorAll('.pad-btn').forEach(el => el.classList.remove('active'));
        }

        auth.signInAnonymously().then(() => {
            document.getElementById('status-log').innerText = "AUTHENTICATED";
            initDualPads();
        }).catch(e => {
            document.getElementById('status-log').innerText = "AUTH FAIL: " + e.message;
        });
    </script>
</body>
</html>
