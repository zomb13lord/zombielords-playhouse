<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Tracker v1.1.0</title>
    <style>
        :root {
            --bg-primary: #020617;
            --panel-bg: #0f172a;
            --text-main: #f8fafc;
            --emerald-accent: #10b981;
            --amber-accent: #f59e0b;
            --border-color: #334155;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: monospace;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Top Zombie Lord Bar */
        .zombie-nav-header {
            background-color: #020617;
            border-b: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-box {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            text-decoration: none;
        }

        .brand-title {
            color: var(--emerald-accent);
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            margin: 0;
        }

        .brand-subtitle {
            color: #f8fafc;
            font-size: 9px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 2px;
        }

        .version-tag {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid var(--border-color);
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 3px;
        }

        .main-wrapper {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* History Ribbon */
        .history-ribbon {
            display: flex;
            overflow-x: auto;
            background-color: #000;
            padding: 12px;
            gap: 6px;
            min-height: 35px;
            align-items: center;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .history-node {
            font-weight: bold;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 2px;
            min-width: 28px;
            text-align: center;
        }

        .node-normal { background-color: #fff; color: #000; }
        .node-hard { background-color: #fff; color: #000; border: 2px dashed #000; }
        .node-point-made { background-color: var(--emerald-accent); color: #fff; }
        .node-seven-out { background-color: #ef4444; color: #fff; }

        /* Unified 12-Column Grid Framework */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 6px;
            margin-bottom: 25px;
            width: 100%;
        }

        .box-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .box-num-header {
            font-size: 24px;
            font-weight: 900;
            color: var(--amber-accent);
            padding: 8px 0;
            background: #090d16;
            border-bottom: 1px solid var(--border-color);
        }

        /* Specific Board Row Colors */
        .color-dark { background-color: #000000; }
        .color-red { background-color: #450a0a; }
        .color-center { background-color: #090d16; }

        .box-count {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            padding: 15px 0;
        }

        .box-sub-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
        }

        .sub-left { background-color: #000000; color: #ffffff; padding: 6px 0; border-right: 1px solid var(--border-color); font-weight: bold; }
        .sub-right { background-color: #1e293b; color: #94a3b8; padding: 6px 0; }

        /* Center Analytics Cell Structures */
        .center-metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            height: 100%;
        }

        .c-cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid var(--border-color);
        }
        .c-cell:last-child { border-right: none; }
        .c-label { font-size: 11px; color: #64748b; font-weight: bold; }
        .c-val { font-size: 18px; font-weight: bold; color: #ffffff; margin-top: 6px; }

        /* Unified Input Controller Panel */
        .controller-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
        }

        .prompt-header {
            font-size: 14px;
            font-weight: bold;
            color: var(--amber-accent);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .pad-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .pad-btn {
            background: #020617;
            color: #fff;
            border: 1px solid var(--border-color);
            font-size: 22px;
            font-weight: bold;
            width: 60px;
            height: 60px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .pad-btn.active {
            background: var(--amber-accent);
            color: #000;
            border-color: #ffffff;
        }

        .action-container { display: flex; gap: 12px; }
        .act-btn { padding: 12px 24px; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; font-size: 14px; text-transform: uppercase; }
        .btn-green { background: var(--emerald-accent); color: white; }
        .btn-orange { background: #f97316; color: white; }
    </style>
</head>
<body>

    <nav class="zombie-nav-header">
        <a href="lobby.html" class="brand-box">
            <h2 class="brand-title">Zombie Lord's</h2>
            <span class="brand-subtitle">Playhouse</span>
        </a>
        <div class="version-tag">VERSION 1.1.0</div>
    </nav>

    <div class="main-wrapper">
        <div class="history-ribbon" id="historyContainer"></div>

        <div class="grid-layout">
            <div class="box-container color-dark"><div class="box-num-header">2</div><div class="box-count" id="count-2">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-2">0</div><div class="sub-right" id="tot-2">0</div></div></div>
            <div class="box-container color-dark"><div class="box-num-header">3</div><div class="box-count" id="count-3">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-3">0</div><div class="sub-right" id="tot-3">0</div></div></div>
            <div class="box-container color-red"><div class="box-num-header">4</div><div class="box-count" id="count-4">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-4">0</div><div class="sub-right" id="tot-4">0</div></div></div>
            <div class="box-container color-red"><div class="box-num-header">5</div><div class="box-count" id="count-5">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-5">0</div><div class="sub-right" id="tot-5">0</div></div></div>
            <div class="box-container color-red"><div class="box-num-header">6</div><div class="box-count" id="count-6">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-6">0</div><div class="sub-right" id="tot-6">0</div></div></div>

            <div class="box-container color-center">
                <div class="box-num-header" style="font-size:12px; color:#94a3b8; padding:15px 0;">ZOMBIELORD DIAGNOSTICS</div>
                <div class="center-metrics-grid">
                    <div class="c-cell"><div class="c-label">RED</div><div class="c-val" id="stat-red">0</div></div>
                    <div class="c-cell"><div class="c-label">SOR</div><div class="c-val" id="stat-sor">0.0</div></div>
                    <div class="c-cell"><div class="c-label">SRR</div><div class="c-val" id="stat-srr">0.0</div></div>
                    <div class="c-cell"><div class="c-label">CO7</div><div class="c-val" id="stat-co7">0</div></div>
                </div>
                <div style="border-top:1px solid var(--border-color); height:29px; background:#000;"></div>
            </div>

            <div class="box-container color-red"><div class="box-num-header">8</div><div class="box-count" id="count-8">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-8">0</div><div class="sub-right" id="tot-8">0</div></div></div>
            <div class="box-container color-red"><div class="box-num-header">9</div><div class="box-count" id="count-9">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-9">0</div><div class="sub-right" id="tot-9">0</div></div></div>
            <div class="box-container color-red"><div class="box-num-header">10</div><div class="box-count" id="count-10">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-10">0</div><div class="sub-right" id="tot-10">0</div></div></div>
            <div class="box-container color-dark"><div class="box-num-header">11</div><div class="box-count" id="count-11">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-11">0</div><div class="sub-right" id="tot-11">0</div></div></div>
            <div class="box-container color-dark"><div class="box-num-header">12</div><div class="box-count" id="count-12">0</div><div class="box-sub-metrics"><div class="sub-left" id="cur-12">0</div><div class="sub-right" id="tot-12">0</div></div></div>

            <div class="box-container color-dark">
                <div class="box-num-header" style="color:#94a3b8; font-size:14px; padding:14px 0;">ROLLS</div>
                <div class="box-count" id="summary-total">0</div>
                <div class="box-sub-metrics">
                    <div class="sub-left" style="grid-column: span 2; background:#000;" id="summary-current">0</div>
                </div>
            </div>
        </div>

        <div class="controller-panel">
            <div class="prompt-header" id="inputPrompt">Input Left Die Outcome</div>
            <div class="pad-grid" id="inputPad"></div>
            
            <div class="action-container">
                <button class="act-btn btn-green" onclick="confirmInput(true)">Confirm (Absolute)</button>
                <button class="act-btn btn-orange" onclick="confirmInput(false)">Unconfirm (Ambiguous)</button>
            </div>
        </div>
    </div>

    <script>
        const engine = {
            totalRolls: 0, currentHandRolls: 0,
            sevensTotal: 0, sevensRed: 0, sevensComeout: 0,
            activePoint: null, shooterHistory: [],
            
            // Core Input Toggle State (1: Left Die, 2: Right Die)
            inputStage: 1, 
            rollLeft: null, rollRight: null,

            matrix: {
                2: {cur:0, tot:0}, 3: {cur:0, tot:0}, 4: {cur:0, tot:0}, 5: {cur:0, tot:0}, 6: {cur:0, tot:0},
                7: {cur:0, tot:0}, 8: {cur:0, tot:0}, 9: {cur:0, tot:0}, 10: {cur:0, tot:0}, 11: {cur:0, tot:0}, 12: {cur:0, tot:0}
            }
        };

        function initPad() {
            const pad = document.getElementById('inputPad');
            pad.innerHTML = '';
            for(let i=1; i<=6; i++) {
                pad.innerHTML += `<button class="pad-btn" id="pad-${i}" onclick="selectValue(${i})">${i}</button>`;
            }
        }

        let selectedValueCache = null;
        function selectValue(val) {
            for(let i=1; i<=6; i++) document.getElementById(`pad-${i}`).classList.remove('active');
            selectedValueCache = val;
            document.getElementById(`pad-${val}`).classList.add('active');
        }

        function confirmInput(isAbsolute) {
            if(!selectedValueCache) return alert("Select a face value via the keypad.");
            
            const val = selectedValueCache;
            resetPadSelection();

            if(engine.inputStage === 1) {
                engine.rollLeft = val;
                engine.inputStage = 2;
                document.getElementById('inputPrompt').innerText = "Input Right Die Outcome";
            } else {
                engine.rollRight = val;
                executeRollCycle(engine.rollLeft, engine.rollRight, isAbsolute);
                
                engine.inputStage = 1;
                document.getElementById('inputPrompt').innerText = "Input Left Die Outcome";
            }
        }

        function resetPadSelection() {
            selectedValueCache = null;
            for(let i=1; i<=6; i++) document.getElementById(`pad-${i}`).classList.remove('active');
        }

        function executeRollCycle(d1, d2, isAbsolute) {
            const sum = d1 + d2;
            engine.totalRolls++;
            engine.currentHandRolls++;

            const isHardway = (d1 === d2) && [4,6,8,10].includes(sum);

            engine.matrix[sum].tot++;
            engine.matrix[sum].cur++;

            if(sum === 7) {
                engine.sevensTotal++;
                if(engine.activePoint === null) {
                    engine.sevensComeout++;
                } else {
                    engine.sevensRed++;
                    engine.shooterHistory.push(engine.currentHandRolls);
                    engine.currentHandRolls = 0;
                    engine.activePoint = null;
                    for (let k in engine.matrix) engine.matrix[k].cur = 0;
                }
            } else {
                if(engine.activePoint === null) {
                    if([4,5,6,8,9,10].includes(sum)) engine.activePoint = sum;
                } else if(sum === engine.activePoint) {
                    engine.activePoint = null;
                }
            }

            renderInterfaceBoard(sum, isHardway);
        }

        function renderInterfaceBoard(lastRoll, isHardway) {
            // Update Dynamic Board Counters
            for(let i=2; i<=12; i++) {
                if(i === 7) continue;
                document.getElementById(`count-${i}`).innerText = engine.matrix[i].tot;
                document.getElementById(`cur-${i}`).innerText = engine.matrix[i].cur;
                document.getElementById(`tot-${i}`).innerText = engine.matrix[i].tot;
            }

            document.getElementById('summary-total').innerText = engine.totalRolls;
            document.getElementById('summary-current').innerText = engine.currentHandRolls;

            const totalShooters = engine.shooterHistory.length + (engine.currentHandRolls > 0 ? 1 : 0);
            const sor = totalShooters > 0 ? (engine.totalRolls / totalShooters).toFixed(1) : "0.0";
            const srr = engine.sevensTotal > 0 ? (engine.totalRolls / engine.sevensTotal).toFixed(1) : "0.0";

            document.getElementById('stat-red').innerText = engine.sevensRed;
            document.getElementById('stat-sor').innerText = sor;
            document.getElementById('stat-srr').innerText = srr;
            document.getElementById('stat-co7').innerText = engine.sevensComeout;

            // Render Dynamic History Sequence Stream Node
            const container = document.getElementById('historyContainer');
            let nodeClass = 'node-normal';
            if (isHardway) nodeClass = 'node-hard';
            if (lastRoll === 7) nodeClass = engine.activePoint === null && engine.currentHandRolls > 0 ? 'node-point-made' : 'node-seven-out';
            
            let label = lastRoll.toString();
            if(isHardway) label += '<sup>(H)</sup>';
            
            container.innerHTML += `<div class="history-node ${nodeClass}">${label}</div>`;
        }

        window.onload = initPad;
    </script>
</body>
</html>
