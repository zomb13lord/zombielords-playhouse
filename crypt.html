<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Crypt | ZombieLord's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@300;400;600&display=swap');
        :root { --bg-dark: #020617; --emerald: #10b981; }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: #f8fafc; 
            font-family: 'Cinzel', serif; min-height: 100vh;
            background-image: linear-gradient(to bottom, rgba(2, 6, 23, 0.6) 0%, rgba(2, 6, 23, 0.95) 100%), 
            url('https://zomb13lord.github.io/zombielords-playhouse/crypt-card.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .emerald-text { color: #10b981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }
        
        .playhouse-glow {
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
                0 0 15px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,1), 0 0 45px rgba(0,0,0,1);
        }

        .zombie-navbar { position: relative; background-image: url('https://zomb13lord.github.io/zombielords-playhouse/navbar-bg.jpg'); background-size: cover; background-position: center; }
        .zombie-navbar::before { content: ''; position: absolute; inset: 0; background: rgba(2, 6, 23, 0.75); z-index: 0; }
        .zombie-navbar > div { position: relative; z-index: 1; }

        .shard { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 8px; transition: all 0.3s ease; }
        .shard:hover { border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 4px 20px rgba(16, 185, 129, 0.1); }
        .shard-btn { 
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(16, 185, 129, 0.3); padding: 10px 15px; 
            transition: 0.3s ease; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            gap: 8px; border-radius: 4px; text-transform: uppercase; font-family: 'Cinzel', serif;
            font-weight: 700; letter-spacing: 0.1em; font-size: 10px;
        }
        .shard-btn:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.15); transform: translateY(-1px); }
        .primary-shard { border-color: rgba(16, 185, 129, 0.8); background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge { background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; padding: 4px 8px; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 9px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
        .select-element { background-color: #0f172a; border: 1px solid rgba(16, 185, 129, 0.3); color: #fff; font-family: 'Montserrat', sans-serif; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: 600; outline: none; cursor: pointer; }
        .select-element:focus { border-color: #10b981; }

        /* Custom Modals */
        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: #020617; border: 1px solid #10b981; border-radius: 8px; width: 100%; max-width: 400px; padding: 30px; box-shadow: 0 0 40px rgba(16, 185, 129, 0.2), inset 0 0 20px rgba(0,0,0,1); text-align: center; }
        .input-wicked { background: #0f172a; border: 1px solid #10b981; color: #fff; font-family: monospace; padding: 12px; border-radius: 4px; width: 100%; text-align: center; font-size: 16px; outline: none; text-transform: uppercase; letter-spacing: 2px; }
        .input-wicked:focus { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        
        .glow-red { filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.9)) drop-shadow(0 0 4px rgba(239, 68, 68, 1)); }
        .glow-emerald { filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.9)) drop-shadow(0 0 4px rgba(16, 185, 129, 1)); }
        .glow-amber { filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.9)) drop-shadow(0 0 4px rgba(245, 158, 11, 1)); }
    </style>
</head>
<body class="flex flex-col">
    <nav class="zombie-navbar p-4 flex justify-between items-center border-b border-emerald-900/50 sticky top-0 z-[50] h-[76px] flex-shrink-0 shadow-[0_4px_20px_rgba(0,0,0,0.8)]">
        <div class="flex flex-col items-center cursor-pointer hover:opacity-80 transition-opacity" onclick="window.location.assign('lobby.html')">
            <h2 class="text-sm font-black emerald-text tracking-tighter uppercase leading-none">ZombieLord's</h2>
            <span class="text-[9px] text-white tracking-[0.4em] uppercase font-bold mt-1 playhouse-glow">Playhouse</span>
        </div>
        <div class="flex items-center gap-6">
            <span id="user-tag" class="text-[9px] tracking-[0.2em] uppercase text-emerald-500/70 font-bold hidden md:block"></span>
            <button onclick="auth.signOut().then(() => window.location.href='index.html')" class="text-[10px] border border-red-500/40 px-4 py-1.5 bg-red-950/30 hover:bg-red-600 hover:text-white transition-all uppercase font-black tracking-[0.2em]">Logout</button>
        </div>
    </nav>

    <main class="flex-grow p-4 md:p-8 pt-8 relative z-10">
        <div class="w-full max-w-5xl mx-auto">
            <div class="text-center mb-10">
                <h1 class="cinzel text-3xl md:text-4xl emerald-text uppercase tracking-[0.3em] font-black">The Crypt</h1>
                <p class="text-xs text-slate-400 tracking-widest uppercase mt-3 font-montserrat">Unified Data Vault</p>
            </div>

            <div class="mb-12">
                <div class="flex justify-between items-end border-b border-emerald-900/40 pb-3 mb-6">
                    <h2 class="cinzel text-lg text-white uppercase tracking-widest">Active Workspace State</h2>
                    <button onclick="purgeActiveBuffer()" class="text-[10px] text-red-400 hover:text-red-300 font-bold tracking-widest uppercase transition-all"><i class="fa-solid fa-trash-can mr-2"></i>Wipe Active Workspace</button>
                </div>
                <div id="active-session-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

            <div>
                <div class="border-b border-emerald-900/40 pb-3 mb-6 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
                    <h2 class="cinzel text-lg text-slate-300 uppercase tracking-widest">Archived Inscriptions</h2>
                    <div class="flex flex-wrap items-center gap-3">
                        <select id="filter-module" class="select-element" onchange="renderCardsGrid()">
                            <option value="ALL">ALL</option>
                            <option value="BACCARAT_TRACKER">BACCARAT TRACKER</option>
                            <option value="DICE_TRACKER">DICE TRACKER</option>
                            <option value="ROULETTE_TRACKER">ROULETTE TRACKER</option>
                            <option value="POKER_LEDGER">POKER LEDGER</option>
                            <option value="SPORTSBOOK_LEDGER">SPORTSBOOK LEDGER</option>
                            <option value="FAVORITES">FAVORITES</option>
                        </select>
                        <select id="sort-rule" class="select-element" onchange="renderCardsGrid()">
                            <option value="SESSION_DESC">SESSION DATE</option>
                            <option value="IMPORT_DESC">IMPORT DATE</option>
                        </select>
                        <button onclick="document.getElementById('csv-file-input').click();" class="shard-btn primary-shard" title="Import"><i class="fa-solid fa-file-import"></i></button>
                        <input type="file" id="csv-file-input" accept=".csv" class="hidden" onchange="processCSVUpload(this.files[0])">
                    </div>
                </div>
                <div id="archive-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </div>
    </main>

    <!-- CUSTOM MODALS -->
    
    <!-- Alert Modal -->
    <div id="modal-alert" class="modal-mask">
        <div class="modal-box border-red-500">
            <i class="fa-solid fa-skull text-red-500 text-4xl mb-4 glow-red"></i>
            <h2 class="text-xl font-black text-red-500 uppercase tracking-widest mb-2 cinzel">System Notice</h2>
            <p id="alert-msg" class="text-xs text-slate-400 font-mono mb-6"></p>
            <button id="btn-alert-ok" class="bg-slate-900 border border-slate-700 text-slate-400 hover:text-white w-full py-3 text-xs font-black uppercase tracking-widest transition-all">Acknowledge</button>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="modal-confirm" class="modal-mask">
        <div class="modal-box border-red-500">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl mb-4 glow-red"></i>
            <h2 class="text-xl font-black text-red-500 uppercase tracking-widest mb-2 cinzel">Confirm Action</h2>
            <p id="confirm-msg" class="text-xs text-slate-400 font-mono mb-6"></p>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-confirm-no" class="bg-slate-900 border border-slate-700 text-slate-400 hover:text-white py-3 text-xs font-black uppercase tracking-widest transition-all">Cancel</button>
                <button id="btn-confirm-yes" class="bg-red-950/60 border border-red-500/50 text-red-400 hover:text-white py-3 text-xs font-black uppercase tracking-widest transition-all">Proceed</button>
            </div>
        </div>
    </div>

    <!-- Prompt Modal -->
    <div id="modal-prompt" class="modal-mask">
        <div class="modal-box border-emerald-500">
            <i class="fa-solid fa-pen-nib text-emerald-500 text-4xl mb-4 glow-emerald"></i>
            <h2 class="text-xl font-black text-emerald-500 uppercase tracking-widest mb-2 cinzel">Inscription</h2>
            <p id="prompt-msg" class="text-xs text-slate-400 font-mono mb-4"></p>
            <input type="text" id="prompt-input" class="input-wicked mb-2" autocomplete="off">
            <p id="prompt-warning" class="text-[10px] text-red-500 font-bold uppercase tracking-widest h-4 mb-4"></p>
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-prompt-cancel" class="bg-slate-900 border border-slate-700 text-slate-400 hover:text-white py-3 text-xs font-black uppercase tracking-widest transition-all">Cancel</button>
                <button id="btn-prompt-submit" class="bg-emerald-950/60 border border-emerald-500/50 text-emerald-400 hover:text-white py-3 text-xs font-black uppercase tracking-widest transition-all">Submit</button>
            </div>
        </div>
    </div>

    <!-- Version Selection Modal -->
    <div id="modal-version" class="modal-mask">
        <div class="modal-box border-amber-500">
            <i class="fa-solid fa-code-branch text-amber-500 text-4xl mb-4 glow-amber"></i>
            <h2 class="text-xl font-black text-amber-500 uppercase tracking-widest mb-2 cinzel">Select Version</h2>
            <p class="text-xs text-slate-400 font-serif italic mb-6">Choose your path of execution.</p>
            <div class="flex flex-col gap-4">
                <button id="btn-version-stable" class="bg-emerald-950/60 hover:bg-emerald-700/80 border border-emerald-500/50 text-emerald-100 w-full py-3 text-xs font-black uppercase tracking-widest transition-all rounded">Invoke (Stable)</button>
                <button id="btn-version-beta" class="bg-amber-950/60 hover:bg-amber-700/80 border border-amber-500/50 text-amber-100 w-full py-3 text-xs font-black uppercase tracking-widest transition-all rounded">Conjure (Beta)</button>
                <button id="btn-version-cancel" class="mt-2 text-[10px] text-slate-500 hover:text-slate-300 uppercase tracking-widest font-bold">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBSUXdz7HqwkENhQqEJLItxYm-LAwkgbmY", authDomain: "zombielords-playhouse.firebaseapp.com", projectId: "zombielords-playhouse", storageBucket: "zombielords-playhouse.firebasestorage.app", messagingSenderId: "795162260246", appId: "1:795162260246:web:97f0361751ac1359b31637" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.firestore();
        
        let currentUid = null;
        let userRole = 'User';
        let cachedRecords = [];

        // --- PROMISE-BASED MODALS ---
        function customAlert(msg) {
            return new Promise(resolve => {
                document.getElementById('alert-msg').innerText = msg;
                document.getElementById('modal-alert').style.display = 'flex';
                document.getElementById('btn-alert-ok').onclick = () => {
                    document.getElementById('modal-alert').style.display = 'none';
                    resolve();
                };
            });
        }

        function customConfirm(msg) {
            return new Promise(resolve => {
                document.getElementById('confirm-msg').innerText = msg;
                document.getElementById('modal-confirm').style.display = 'flex';
                document.getElementById('btn-confirm-yes').onclick = () => {
                    document.getElementById('modal-confirm').style.display = 'none';
                    resolve(true);
                };
                document.getElementById('btn-confirm-no').onclick = () => {
                    document.getElementById('modal-confirm').style.display = 'none';
                    resolve(false);
                };
            });
        }

        function customPrompt(msg, defaultVal, validatorFn) {
            return new Promise(resolve => {
                const modal = document.getElementById('modal-prompt');
                const input = document.getElementById('prompt-input');
                const warn = document.getElementById('prompt-warning');
                
                document.getElementById('prompt-msg').innerText = msg;
                input.value = defaultVal || '';
                warn.innerText = '';
                modal.style.display = 'flex';
                input.focus();
                
                document.getElementById('btn-prompt-submit').onclick = () => {
                    const val = input.value.trim().toUpperCase();
                    const errorMsg = validatorFn(val);
                    if (errorMsg) {
                        warn.innerText = errorMsg;
                    } else {
                        modal.style.display = 'none';
                        resolve(val);
                    }
                };
                
                document.getElementById('btn-prompt-cancel').onclick = () => {
                    modal.style.display = 'none';
                    resolve(null);
                };
            });
        }

        function customVersionSelect() {
            return new Promise(resolve => {
                const modal = document.getElementById('modal-version');
                modal.style.display = 'flex';
                
                document.getElementById('btn-version-stable').onclick = () => {
                    modal.style.display = 'none';
                    resolve('stable');
                };
                document.getElementById('btn-version-beta').onclick = () => {
                    modal.style.display = 'none';
                    resolve('beta');
                };
                document.getElementById('btn-version-cancel').onclick = () => {
                    modal.style.display = 'none';
                    resolve(null);
                };
            });
        }

        // --- AUTH & INIT ---
        auth.onAuthStateChanged(async user => {
            if (!user) { window.location.href = "index.html"; return; }
            currentUid = user.uid;
            document.getElementById('user-tag').innerText = user.displayName || "Wicked Soul";
            
            try {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) userRole = doc.data().role || 'User';
            } catch(e) { console.error("Failed to fetch role", e); }

            fetchCryptData();
        });

        async function purgeActiveBuffer() {
            const confirmed = await customConfirm("Are you sure you want to clear the active workspace?");
            if(confirmed) {
                await db.collection("users").doc(currentUid).collection("crypt").doc("active_session").delete();
                fetchCryptData();
            }
        }

        async function fetchCryptData() {
            const cryptRef = db.collection("users").doc(currentUid).collection("crypt");
            try {
                const activeDoc = await cryptRef.doc("active_session").get();
                const activeContainer = document.getElementById('active-session-container');
                if (activeDoc.exists) { 
                    activeContainer.innerHTML = generateCardHtml(activeDoc.id, activeDoc.data(), true); 
                } else { 
                    activeContainer.innerHTML = `<div class="shard p-8 text-center border-dashed text-xs text-slate-500 tracking-widest uppercase col-span-full">No Active Workspace Document Restored inside the Crypt.</div>`; 
                }

                const snap = await cryptRef.get();
                cachedRecords = [];
                snap.forEach(doc => { 
                    if(doc.id !== "active_session") {
                        let data = doc.data();
                        data.id = doc.id;
                        cachedRecords.push(data);
                    }
                });
                renderCardsGrid();
            } catch (e) { console.error("Extraction fault: ", e); }
        }

        function calculateMetrics(modId, logArray) {
            let srr = "0.0";
            let outTime = "N/A";
            let epochTime = 0;
            
            if (!logArray || logArray.length === 0) return { srr, outTime, epochTime };

            if (modId === "DICE_TRACKER") {
                const total = logArray.length;
                const sevens = logArray.filter(r => (r.Total_Sum === 7 || r.sum === 7) && !(r.Invalid_Roll || r.invalidRoll)).length;
                srr = sevens > 0 ? (total / sevens).toFixed(1) : total.toFixed(1);
                
                const lastRow = logArray[logArray.length - 1];
                const rawTime = lastRow.Time_Stamp || lastRow.timeStamp;
                if (rawTime) {
                    const d = new Date(rawTime);
                    epochTime = d.getTime();
                    outTime = d.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
                }
            } else if (modId === "ROULETTE_TRACKER") {
                const lastRow = logArray[logArray.length - 1];
                const rawTime = lastRow.t;
                if (rawTime) {
                    const d = new Date(typeof rawTime === 'number' ? rawTime : parseInt(rawTime));
                    epochTime = d.getTime();
                    outTime = d.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
                }
            } else {
                // Generic fallback for Baccarat, Poker, Sportsbook
                const lastRow = logArray[logArray.length - 1];
                const rawTime = lastRow.Time_Stamp || lastRow.timestamp || lastRow.t;
                if (rawTime) {
                    const d = new Date(typeof rawTime === 'number' ? rawTime : rawTime);
                    epochTime = d.getTime();
                    outTime = d.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: 'numeric' });
                }
            }
            return { srr, outTime, epochTime };
        }

        function renderCardsGrid() {
            const filterMod = document.getElementById('filter-module').value;
            const sortRule = document.getElementById('sort-rule').value;
            const container = document.getElementById('archive-container');
            
            let workingSet = [...cachedRecords];

            if (filterMod === "FAVORITES") {
                workingSet = workingSet.filter(r => r.is_favorite === true);
            } else if (filterMod !== "ALL") {
                workingSet = workingSet.filter(r => r.module_id === filterMod);
            }

            workingSet.sort((a, b) => {
                if (sortRule === "IMPORT_DESC") {
                    const tA = a.timestamp ? (a.timestamp.seconds || a.timestamp._seconds || 0) : 0;
                    const tB = b.timestamp ? (b.timestamp.seconds || b.timestamp._seconds || 0) : 0;
                    return tB - tA;
                } else {
                    let logA = [], logB = [];
                    try { logA = a.payload_log ? (typeof a.payload_log === 'string' ? JSON.parse(a.payload_log) : a.payload_log) : []; } catch(e){}
                    try { logB = b.payload_log ? (typeof b.payload_log === 'string' ? JSON.parse(b.payload_log) : b.payload_log) : []; } catch(e){}
                    
                    const mA = calculateMetrics(a.module_id, logA);
                    const mB = calculateMetrics(b.module_id, logB);
                    return mB.epochTime - mA.epochTime;
                }
            });

            let html = '';
            workingSet.forEach(data => {
                html += generateCardHtml(data.id, data, false);
            });
            container.innerHTML = html || `<div class="text-center text-xs text-slate-600 tracking-widest p-8 shard col-span-full">CRYPT IS VACANT</div>`;
        }

        function generateCardHtml(id, data, isActive) {
            let logArray = [];
            try { logArray = data.payload_log ? (typeof data.payload_log === 'string' ? JSON.parse(data.payload_log) : data.payload_log) : []; } catch(e) { logArray = []; }
            
            const count = logArray.length;
            const title = data.name || (isActive ? "ACTIVE BUFFER" : `INSCRIPTION ${id.substring(0,6)}`);
            const moduleTag = data.module_id || "UNASSIGNED";
            const isFav = data.is_favorite || false;
            
            const { srr, outTime } = calculateMetrics(moduleTag, logArray);

            let badgeColor = 'border-emerald-500/40 text-emerald-400';
            if (moduleTag === 'DICE_TRACKER') badgeColor = 'border-amber-500/40 text-amber-400';
            if (moduleTag === 'BACCARAT_TRACKER') badgeColor = 'border-red-500/40 text-red-400';
            if (moduleTag === 'POKER_LEDGER') badgeColor = 'border-blue-500/40 text-blue-400';
            if (moduleTag === 'SPORTSBOOK_LEDGER') badgeColor = 'border-purple-500/40 text-purple-400';

            return `
            <div class="shard p-5 relative flex flex-col justify-between min-h-[220px] ${isActive ? 'border-l-4 border-l-emerald-500' : ''}">
                <div class="absolute top-4 right-4 flex items-center gap-2 z-10">
                    ${!isActive ? `
                        <button onclick="toggleFavorite('${id}', ${isFav})" class="text-slate-500 hover:text-amber-400 transition-colors">
                            <i class="${isFav ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star'} text-sm"></i>
                        </button>
                    ` : '<div class="bg-emerald-500/20 text-emerald-400 text-[8px] px-2 py-0.5 font-bold tracking-widest">BUFF_ACTIVE</div>'}
                </div>
                
                <div class="w-full">
                    <div class="flex items-start gap-2 pr-8 mb-3">
                        <h3 class="text-emerald-400 font-bold text-sm tracking-widest uppercase truncate flex-grow">
                            ${title} 
                        </h3>
                        <button onclick="editInscName('${id}', '${data.name || ''}')" class="text-slate-600 hover:text-emerald-400 transition-colors flex-shrink-0"><i class="fa-solid fa-pen-to-square text-[10px]"></i></button>
                    </div>
                    <div class="mb-4">
                        <span class="badge ${badgeColor}">${moduleTag.replace('_',' ')}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-y-2 border-t border-emerald-900/20 pt-3 mb-4 font-montserrat text-xs tracking-wide text-slate-400">
                        <div>DATE: <span class="text-slate-200 font-semibold font-mono">${outTime}</span></div>
                        <div class="text-right">ENTRIES: <span class="text-emerald-400 font-bold font-mono">${count}</span></div>
                        ${moduleTag === 'DICE_TRACKER' ? `<div>SRR: <span class="text-amber-400 font-bold font-mono">${srr}</span></div>` : ''}
                    </div>
                </div>

                <div class="flex items-center gap-2 border-t border-emerald-900/20 pt-3 w-full mt-auto">
                    <button onclick="resumeInsc('${id}')" class="shard-btn primary-shard flex-grow py-2"><i class="fa-solid fa-play text-[9px]"></i> Resume</button>
                    <button onclick="exportInscToCSV('${id}')" class="shard-btn text-slate-300 hover:text-white px-3.5 py-2" title="Export"><i class="fa-solid fa-file-csv text-sm"></i></button>
                    ${!isActive ? `<button onclick="deleteInsc('${id}')" class="shard-btn text-red-500/70 hover:text-red-400 hover:border-red-500/50 px-3.5 py-2" title="Delete"><i class="fa-solid fa-trash text-sm"></i></button>` : ''}
                </div>
            </div>`;
        }

        async function toggleFavorite(docId, currentStatus) {
            try {
                await db.collection("users").doc(currentUid).collection("crypt").doc(docId).update({
                    is_favorite: !currentStatus
                });
                fetchCryptData();
            } catch(e) { console.error("Favorite write fault: ", e); }
        }

        async function resumeInsc(docId) {
            try {
                const doc = await db.collection("users").doc(currentUid).collection("crypt").doc(docId).get();
                if(!doc.exists) return await customAlert("Could not find the selected session.");
                
                const data = doc.data();
                await db.collection("users").doc(currentUid).collection("crypt").doc("active_session").set(data);
                
                const mod = data.module_id;
                let prefix = "";

                // Check if user has Beta privileges
                if (['Beta User', 'Admin', 'Master Admin'].includes(userRole)) {
                    // Only prompt for modules that actually have a beta version
                    if (['DICE_TRACKER', 'ROULETTE_TRACKER', 'BACCARAT_TRACKER'].includes(mod)) {
                        const choice = await customVersionSelect();
                        if (!choice) return; // User cancelled
                        if (choice === 'beta') prefix = "beta-";
                    }
                }

                if (mod === "DICE_TRACKER") window.location.assign(`${prefix}dice.html`);
                else if (mod === "ROULETTE_TRACKER") window.location.assign(`${prefix}roulette.html`);
                else if (mod === "BACCARAT_TRACKER") window.location.assign(`${prefix}baccarat.html`);
                else if (mod === "POKER_LEDGER") window.location.assign(`poker.html`);
                else if (mod === "SPORTSBOOK_LEDGER") window.location.assign(`sportsbook.html`);
                else await customAlert("Could not determine which tracker to open.");

            } catch (e) { await customAlert("Failed to resume session."); }
        }

        async function exportInscToCSV(docId) {
            try {
                const doc = await db.collection("users").doc(currentUid).collection("crypt").doc(docId).get();
                if (!doc.exists) return await customAlert("Could not find the selected session.");
                
                const data = doc.data();
                let logArray = [];
                try { logArray = data.payload_log ? (typeof data.payload_log === 'string' ? JSON.parse(data.payload_log) : data.payload_log) : []; } catch(e) { logArray = []; }

                let csvString = "";
                
                if (data.module_id === "DICE_TRACKER") {
                    csvString = '"Time_Stamp","Roll_Index","Puck_Before_Roll","Left_Die","Right_Die","Total_Sum","Location_ID","Table_Position","Shooter_ID","Left_Top","Left_Back","Right_Top","Right_Back","Kinematic_Status","Left_Kinematic","Right_Kinematic","Invalid_Roll","Notes"\n';
                    logArray.forEach(r => {
                        let lTop = r.Left_Top !== undefined ? r.Left_Top : (r.Left_Set_Face ? r.Left_Set_Face.split('/')[0] : 3);
                        let lBack = r.Left_Back !== undefined ? r.Left_Back : (r.Left_Set_Face ? r.Left_Set_Face.split('/')[1] : 6);
                        let rTop = r.Right_Top !== undefined ? r.Right_Top : (r.Right_Set_Face ? r.Right_Set_Face.split('/')[0] : 3);
                        let rBack = r.Right_Back !== undefined ? r.Right_Back : (r.Right_Set_Face ? r.Right_Set_Face.split('/')[1] : 2);
                        
                        let lKin = r.Left_Kinematic !== null && r.Left_Kinematic !== undefined ? (typeof r.Left_Kinematic === 'object' ? r.Left_Kinematic.rot : r.Left_Kinematic) : '';
                        let rKin = r.Right_Kinematic !== null && r.Right_Kinematic !== undefined ? (typeof r.Right_Kinematic === 'object' ? r.Right_Kinematic.rot : r.Right_Kinematic) : '';

                        csvString += `"${r.Time_Stamp || r.timeStamp || ''}","${r.Roll_Index || r.rollIndex || 0}","${r.Puck_Before_Roll || r.puckBeforeRoll || 'OFF'}",`
                                  + `"${r.Left_Die || r.leftDie || 0}","${r.Right_Die || r.rightDie || 0}","${r.Total_Sum || r.sum || 0}",`
                                  + `"${r.Location_ID || r.locationId || 'UNASSIGNED'}","${r.Table_Position || r.tablePosition || 'UNASSIGNED'}","${r.Shooter_ID || r.shooterId || 'UNASSIGNED'}",`
                                  + `"${lTop}","${lBack}","${rTop}","${rBack}","${r.Kinematic_Status || r.kinematicStatus || false}",`
                                  + `"${lKin}","${rKin}",`
                                  + `"${r.Invalid_Roll || r.invalidRoll || false}","${(r.Notes || r.description || '').replace(/"/g, '""')}"\n`;
                    });
                } else if (data.module_id === "ROULETTE_TRACKER") {
                    csvString = '"Time_Stamp","Value"\n';
                    logArray.forEach(r => {
                        csvString += `"${r.t || ''}","${r.n || ''}"\n`;
                    });
                } else {
                    return await customAlert("Unsupported export transformation context.");
                }

                const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
                const anchor = document.createElement("a");
                anchor.setAttribute("href", URL.createObjectURL(blob));
                anchor.setAttribute("download", `${(data.name || 'SESSION')}.csv`);
                document.body.appendChild(anchor);
                anchor.click();
                document.body.removeChild(anchor);
            } catch (err) { await customAlert("Failed to export the session to CSV."); }
        }

        function processCSVUpload(fileObject) {
            if (!fileObject) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/);
                    if (lines.length < 2) return await customAlert("The selected file is empty or invalid.");
                    
                    const cleanStr = (val) => (val || '').replace(/^"|"$/g, '').trim();
                    
                    const headers = lines[0].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g).map(cleanStr);
                    if (!headers || headers.length === 0) return await customAlert("Could not read the column headers in the file.");
                    
                    lines.shift(); 
                    
                    let modId = "UNKNOWN";
                    if (headers.includes("Puck_Before_Roll")) modId = "DICE_TRACKER";
                    else if (headers.includes("Value") || headers.includes("n")) modId = "ROULETTE_TRACKER";
                    
                    if (modId === "UNKNOWN") return await customAlert("Could not detect if this is a Dice or Roulette file.");

                    let defaultName = fileObject.name.replace(/\.[^/.]+$/, "").toUpperCase();
                    
                    const validator = (val) => {
                        if (!val) return "Name cannot be empty.";
                        if (cachedRecords.some(r => r.name === val)) return "A session with this name already exists.";
                        return null;
                    };

                    const sessionName = await customPrompt("Enter a name for this imported session:", defaultName, validator);
                    if (!sessionName) return; // User cancelled
                    
                    let payloadArray = [];
                    
                    lines.forEach(line => {
                        if (!line.trim()) return;
                        let cells = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                        if (!cells) return;
                        
                        let rowData = {};
                        headers.forEach((header, index) => {
                            rowData[header] = cells[index] ? cleanStr(cells[index]) : "";
                        });

                        if (modId === "DICE_TRACKER") {
                            payloadArray.push({
                                Time_Stamp: rowData["Time_Stamp"] || "",
                                Roll_Index: parseInt(rowData["Roll_Index"]) || 0,
                                Puck_Before_Roll: rowData["Puck_Before_Roll"] === 'OFF' ? null : parseInt(rowData["Puck_Before_Roll"]),
                                Left_Die: parseInt(rowData["Left_Die"]) || 0,
                                Right_Die: parseInt(rowData["Right_Die"]) || 0,
                                Total_Sum: parseInt(rowData["Total_Sum"]) || 0,
                                Location_ID: rowData["Location_ID"] || "UNASSIGNED",
                                Table_Position: rowData["Table_Position"] || "UNASSIGNED",
                                Shooter_ID: rowData["Shooter_ID"] || "UNASSIGNED",
                                Left_Top: parseInt(rowData["Left_Top"]) || 3,
                                Left_Back: parseInt(rowData["Left_Back"]) || 6,
                                Right_Top: parseInt(rowData["Right_Top"]) || 3,
                                Right_Back: parseInt(rowData["Right_Back"]) || 2,
                                Kinematic_Status: rowData["Kinematic_Status"] === 'true',
                                Left_Kinematic: rowData["Left_Kinematic"] !== '' ? parseInt(rowData["Left_Kinematic"]) : null,
                                Right_Kinematic: rowData["Right_Kinematic"] !== '' ? parseInt(rowData["Right_Kinematic"]) : null,
                                Invalid_Roll: rowData["Invalid_Roll"] === 'true',
                                Notes: rowData["Notes"] || ""
                            });
                        } else if (modId === "ROULETTE_TRACKER") {
                            payloadArray.push({
                                t: parseInt(rowData["Time_Stamp"]) || Date.now(),
                                n: rowData["Value"] || ""
                            });
                        }
                    });

                    const payloadDocument = {
                        module_id: modId,
                        name: sessionName,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        is_favorite: false,
                        meta_tags: { 
                            location: payloadArray[0]?.Location_ID || "IMPORTED", 
                            shooter_or_dealer: payloadArray[0]?.Shooter_ID || "IMPORTED", 
                            base_unit: 1 
                        },
                        payload_log: JSON.stringify(payloadArray)
                    };

                    await db.collection("users").doc(currentUid).collection("crypt").doc("archive_" + Date.now()).set(payloadDocument);
                    await customAlert(`Successfully imported ${payloadArray.length} records.`);
                    fetchCryptData();
                } catch(err) { 
                    console.error(err);
                    await customAlert("An error occurred while reading the file."); 
                }
            };
            reader.readAsText(fileObject);
            document.getElementById('csv-file-input').value = "";
        }

        async function editInscName(docId, oldName) {
            const validator = (val) => {
                if (!val) return "Name cannot be empty.";
                if (val === oldName) return null; // No change made
                if (cachedRecords.some(r => r.name === val && r.id !== docId)) return "A session with this name already exists.";
                return null;
            };

            const newName = await customPrompt("Enter a new name for this session:", oldName, validator);
            if (newName && newName !== oldName) {
                await db.collection("users").doc(currentUid).collection("crypt").doc(docId).update({ name: newName });
                fetchCryptData();
            }
        }

        async function deleteInsc(id) {
            const confirmed = await customConfirm("Are you sure you want to delete this session?");
            if(confirmed) {
                await db.collection("users").doc(currentUid).collection("crypt").doc(id).delete();
                fetchCryptData();
            }
        }
    </script>
